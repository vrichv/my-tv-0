name: build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run build with Gradle wrapper
        run: ./gradlew assembleRelease

      - name: Sign app APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          alias: ${{ secrets.ALIAS }}
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ALIAS_PASSWORD }}
        env:
          # override default build-tools version (29.0.3) -- optional
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Get History
        id: get_history
        run: |
          chmod +x history.sh
          output=$(./history.sh)
          echo "$output" > history.md

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          body_path: history.md

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          asset_name: my-tv-0-${{ github.ref_name }}.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Push APK and version.json to release branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Determine the branch this tag belongs to
          TAG_COMMIT=$(git rev-list -n 1 "${{ github.ref }}")
          BRANCH=$(git branch -r --contains "$TAG_COMMIT" | grep -v 'HEAD' | head -1 | sed 's/.*origin\///' | xargs)
          if [ -z "$BRANCH" ]; then
            echo "Could not determine branch from tag, using default: kk"
            BRANCH="kk"
          fi
          echo "Build branch: $BRANCH"

          # Derive version info from tag
          TAG_NAME="${{ github.ref_name }}"
          VERSION_CODE=$(echo "$TAG_NAME" | sed 's/^v//' | sed 's/\.//g')
          echo "Version: $TAG_NAME (code: $VERSION_CODE)"

          # Build version.json
          cat > version.json << JSONEOF
          {
            "version_code": $VERSION_CODE,
            "version_name": "$TAG_NAME"
          }
          JSONEOF
          cat version.json

          # Fetch existing release branch content (if any), then start orphan
          git fetch origin release 2>/dev/null && RELEASE_EXISTS=true || RELEASE_EXISTS=false
          if [ "$RELEASE_EXISTS" = true ]; then
            # Preserve other branch dirs by extracting them first
            git archive origin/release --prefix=existing/ 2>/dev/null | tar -xf - 2>/dev/null || true
          fi

          git checkout --orphan release-latest

          # Restore other branch dirs (everything except current branch dir)
          if [ -d existing ] && [ "$(ls -A existing 2>/dev/null)" ]; then
            cp -r existing/* ./ 2>/dev/null || true
            rm -rf existing
          fi

          # Place current build files, overwriting any existing
          rm -rf "$BRANCH"
          mkdir -p "$BRANCH"
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "$BRANCH/my-tv-0.apk"
          cp version.json "$BRANCH/version.json"

          git add -A
          git commit -m "Release $TAG_NAME for $BRANCH"
          git push --force origin release-latest:release
